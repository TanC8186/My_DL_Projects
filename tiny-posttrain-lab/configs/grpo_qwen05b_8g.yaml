# 8GB-friendly GRPO with a verifiable reward (arithmetic).
#
# Starts from the base instruct weights on purpose: this isolates GRPO's own
# contribution. Chaining after SFT/DPO would confound "did GRPO help" with
# "was the starting adapter already better at math". Set `start_from` to an
# adapter directory if you want to continue one instead.
#
# The reward is exact (`src/my_lab/rewards.py:accuracy_reward`), so the metric
# is a real checker rather than a proxy. Measured with `scripts/eval_math.py`
# on a held-out split that is guaranteed disjoint from training.

experiment_id: 2026-09-grpo-math
method: grpo
notes: Verifiable-reward GRPO on generated arithmetic; held-out eval in eval_*.md.
start_from: null

model:
  model_name_or_path: E:/My_DL_Projects/qwen/Qwen2___5-0___5B-Instruct
  torch_dtype: bfloat16
  load_in_4bit: false
  attn_implementation: sdpa

lora:
  enabled: true
  r: 8                        # smaller rank to save VRAM during RL
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  # Generated by scripts/make_math_dataset.py (200 train / 100 held-out eval,
  # disjoint by construction).
  dataset_path: E:/My_DL_Projects/tiny-posttrain-lab/data/math_train.jsonl
  eval_path: E:/My_DL_Projects/tiny-posttrain-lab/data/math_eval.jsonl
  max_samples: 200
  max_prompt_length: 128
  # Completions longer than this are truncated, so the model never emits its
  # final number and scores 0. That punishes rambling, which is the intent,
  # but it also adds noise. Raise it if the reward curve looks erratic.
  max_completion_length: 192

grpo:
  # 4 generations per prompt. With a sharp 0.5B distribution, 2 samples are often
  # byte-identical, which makes the group's advantage 0 and wastes the step. More
  # samples raise the chance of a mixed group, which is where GRPO actually learns.
  # Affordable here because generation is fast without gradient checkpointing.
  num_generations: 4
  temperature: 1.0
  beta: 0.0                   # no KL vs ref if 0 (saves a forward); set >0 later
  reward_function: accuracy   # see src/my_lab/rewards.py
  per_device_train_batch_size: 1
  # TRL requires generation_batch_size (= batch x accum) to be divisible by
  # num_generations, so accum must be >= 4 here. With 2 epochs that is
  # 200 prompts x 2 / 4 = 100 optimizer steps.
  gradient_accumulation_steps: 4
  # Higher than the usual full-model 1e-6 because only a LoRA adapter is trained
  # and the run is short.
  learning_rate: 1.0e-5
  # 2 passes over 200 prompts. Costs only generation time (fast without gradient
  # checkpointing) and buys 100 optimizer steps instead of 50. Overfitting to these
  # 200 prompts is possible, which is exactly what the held-out eval detects.
  num_train_epochs: 2
  logging_steps: 1
  save_steps: 100
  # MUST stay false. TRL's GRPOTrainer calls gradient_checkpointing_enable() and
  # enable_input_require_grads() but never disables them before generating. The
  # embedding hook then corrupts the generation pass: measured on this machine,
  # the same prompt yields a clean 4-token answer ('476') without checkpointing
  # and 192 tokens of garbage with it, so every reward is 0 and GRPO gets no
  # signal at all. VRAM is not a constraint here (0.5B + LoRA peaks near 1.5 GB),
  # so simply leaving it off is the right trade.
  gradient_checkpointing: false
  bf16: true
  report_to: []
  seed: 42

output_dir: E:/My_DL_Projects/tiny-posttrain-lab/experiments/2026-09-grpo-math/output

if_oom:
  - lower num_generations to 2
  - lower max_completion_length
  - enable load_in_4bit
  - reduce per_device_train_batch_size to 1 (already set)
  - use smaller model or shorter prompts

note_on_gradient_checkpointing:
  Do NOT turn gradient_checkpointing back on for GRPO. TRL enables it and the
  input-embedding grad hook, but never disables them around generation, which
  corrupts every completion (192-token garbage instead of the answer), zeroes all
  rewards, and leaves GRPO with no learning signal while loss/grad_norm read 0.0.
  VRAM is not the constraint at this model size.
